<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flare Telemetry</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header><h1>FLARE TELEMETRY</h1><span id="live" class="live-pill"><span class="dot"></span><span id="live-text">connecting...</span></span><div class="spacer"></div><nav class="viewnav"><button type="button" data-view="live">Live</button><button type="button" data-view="map">Map</button><button type="button" data-view="history">History</button></nav><button id="logout" class="ghost" type="button">Sign out</button></header>
  <main>
    <section id="view-live"><div id="primary-cards" class="primary-metrics"></div><button id="toggle-details" class="ghost detail-toggle" type="button">Show detailed telemetry</button><button id="enable-live-chart" class="ghost detail-toggle" type="button">Enable live chart</button><div id="live-chart-panel" class="chart-card live-chart" hidden><canvas id="live-chart-canvas"></canvas></div><div id="detail-cards" class="subsystem-grid" hidden></div></section>
    <section id="view-map" hidden><div class="range-controls"><label class="ctl">Session <select id="map-session"></select></label></div><div id="map-page-map" class="full-map"></div></section>
    <section id="view-history" hidden><div class="range-controls"><label class="ctl">Session <select id="hist-session"></select></label><label class="ctl">Statistic <select id="statistic"></select></label><label class="ctl">From <input id="history-since" type="number" placeholder="Unix seconds" /></label><label class="ctl">To <input id="history-until" type="number" placeholder="Unix seconds" /></label><label class="ctl">Filter <select id="filter-kind"><option value="none">All values</option><option value="above">Above</option><option value="below">Below</option><option value="between">Between</option></select></label><input id="filter-a" type="number" placeholder="Value" /><input id="filter-b" type="number" placeholder="And" hidden /></div><div class="chart-card history-chart"><canvas id="history-canvas"></canvas></div><div id="history-summary" class="history-summary muted">No values loaded.</div><div class="history-actions"><button id="toggle-table" class="ghost" type="button">Show selected values</button><button id="download-selected" class="ghost" type="button">Download CSV</button></div><div id="history-table-wrap" hidden><table><tbody id="history-table"></tbody></table></div></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="/static/schema.js"></script><script src="/static/cards.js"></script><script src="/static/live.js"></script><script src="/static/history-app.js"></script><script src="/static/main.js"></script>
</body>
</html>
