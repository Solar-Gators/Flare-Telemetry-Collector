# Telemetry website stack: FastAPI (web) + Postgres (db) + Caddy (HTTPS).
# Run from the server/ directory:  docker compose up -d --build
# Configure via server/.env (copy from .env.example).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flare -d flare"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..                 # repo root, so shared/ is in the build context
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://flare:${POSTGRES_PASSWORD}@db:5432/flare
      FLARE_INGEST_TOKEN: ${FLARE_INGEST_TOKEN}
      FLARE_VIEW_PASSWORD: ${FLARE_VIEW_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
